<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hemmet">
</head>
<body>
<title>Hemmet Lilltjäravägen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: wall-panel dashboard — slim icon rail on the left (bottom tab bar on phones), card grid per room/topic, one hero card per view */
:root{
  --bg:#0a0f16; --bg-2:#0e151f; --panel:#131c28; --panel-2:#1a2534; --panel-3:#223043;
  --line:rgba(160,190,230,.08); --line-2:rgba(160,190,230,.14);
  --fg:#eaf0f7; --muted:#8b98ab; --dim:#5d6a7d;
  --music:#a78bfa; --power:#f5c542; --light:#f6cf55; --house:#34d399; --bus:#3d8bfd; --bajen:#14a35b; --bajen-2:#0b6e3c; --copper:#c98a5e; --c-price:#4a8fe0; --c-cons:#b8861c; --c-prod:#14935f;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --r:18px; --r-sm:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%, #142235 0%, transparent 60%), var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100%}
/* rail */
.rail{position:sticky;top:0;height:100vh;width:92px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(8px, env(safe-area-inset-left,0px));background:linear-gradient(#0c131c,#0a0f16);border-right:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px;position:relative;color:var(--house)}
.logo i{position:absolute;right:2px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.logo.off i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.nav{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:8px 0 7px;border-radius:14px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600}
.nav a .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel-2);color:var(--muted);transition:background .2s,color .2s}
.nav a[aria-current="page"]{background:var(--panel);color:var(--fg)}
.nav a[aria-current="page"] .ic{background:var(--c,var(--house));color:#0a0f16;box-shadow:0 6px 18px -6px var(--c,var(--house))}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;align-items:center}
.rail-foot button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px}
.rail-foot button[aria-pressed="true"]{color:var(--warn)}
/* main */
main{flex:1;min-width:0;padding-block:20px 28px;padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px))}
.view-title{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.01em;margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.span-2{grid-column:span 2}.span-3{grid-column:span 3}.span-4{grid-column:1/-1}
@media (max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.span-3{grid-column:span 2}}
@media (max-width:720px){
  .grid{grid-template-columns:minmax(0,1fr)}.span-2,.span-3{grid-column:auto}
  .app{flex-direction:column}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;width:auto;flex-direction:row;z-index:20;padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);background:rgba(10,15,22,.94);backdrop-filter:blur(10px)}
  .logo,.rail-foot{display:none}
  .nav{flex-direction:row;justify-content:space-around}
  .nav a{padding:4px 0;font-size:10px;white-space:nowrap;min-width:0}.nav a .ic{width:32px;height:32px}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
/* cards */
.card{background:linear-gradient(180deg,var(--panel),#111925);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;position:relative}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:28px}
.badge-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 22%, transparent);color:var(--c)}
.card-t{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--panel-3);color:var(--fg);white-space:nowrap}
.pill.ok{background:rgba(52,211,153,.14);color:var(--ok)}.pill.warn{background:rgba(251,191,36,.14);color:var(--warn)}.pill.bad{background:rgba(248,113,113,.15);color:var(--bad)}.pill.info{background:rgba(96,165,250,.15);color:var(--info)}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12px}
.big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;letter-spacing:-.02em}
.mid{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05}
.unit{font-size:14px;color:var(--muted);font-family:var(--body);font-weight:500;margin-left:3px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-family:var(--display);font-weight:700;font-size:22px;margin-top:2px}
.tile .s{font-size:11.5px;color:var(--dim)}
.tile.alert{border-color:rgba(251,191,36,.45)}.tile.alert-bad{border-color:rgba(248,113,113,.5)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.list{display:flex;flex-direction:column}
.list .li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.list .li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-weight:600;font-size:13px;min-height:44px;transition:background .15s,transform .1s}
.btn:hover{background:var(--panel-3)}.btn:active{transform:scale(.97)}
.btn.busy{opacity:.55;pointer-events:none}
.btn .bi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--muted)) 20%, transparent);color:var(--c,var(--fg))}
.btn.danger{border-color:rgba(248,113,113,.35);color:var(--bad)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick .btn{justify-content:flex-start;text-align:left;line-height:1.15}
@media (max-width:460px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.stale{font-size:11.5px;color:var(--dim);margin-top:10px}
.err{font-size:12.5px;color:var(--warn);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:10px;padding:8px 10px;margin-top:8px}
/* header weather */
.top{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:18px 22px}
.clock{font-family:var(--display);font-weight:500;font-size:64px;line-height:.95;letter-spacing:-.03em}
.date{font-size:15px;color:var(--muted);margin-top:4px;text-transform:capitalize}
.wx{display:flex;flex-wrap:wrap;align-items:center;gap:18px 26px;justify-content:flex-end}
.wx-main{display:flex;align-items:center;gap:12px}
.wx-main .big{font-size:46px}
.wx-facts{display:flex;flex-wrap:wrap;gap:8px}
.wx-facts .tile{padding:8px 12px}.wx-facts .tile .v{font-size:17px}
@media (max-width:720px){.top{grid-template-columns:1fr}.wx{justify-content:flex-start}.clock{font-size:52px}}
/* bus */
.bus{--c:var(--bus);background:linear-gradient(160deg,#10305c 0%,#0f1d33 70%);border-color:rgba(61,139,253,.3)}
.bus-line{font-family:var(--display);font-weight:800;font-size:15px;background:var(--bus);color:#fff;border-radius:8px;padding:3px 9px;letter-spacing:.02em}
.bus-next{display:flex;align-items:flex-end;gap:14px;margin:4px 0 12px}
.bus-next .big{font-size:54px}
.dep{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
.dep .t{font-family:var(--display);font-weight:700;font-size:17px;min-width:52px}
.dep .m{font-weight:700;font-size:15px;color:#cfe0ff}
.dep.cancel .t,.dep.cancel .grow{text-decoration:line-through;color:var(--bad)}
/* bajen */
.bajen{--c:#fff;background:linear-gradient(160deg,var(--bajen-2) 0%,#0b3d26 55%,#0d2219 100%);border-color:rgba(20,163,91,.4);overflow:hidden;padding-bottom:20px}
.bajen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--bajen) 0 28px,#f4f7f5 28px 56px)}
.bajen .badge-ic{background:rgba(255,255,255,.14);color:#fff}
.bajen .card-t{color:#cdeedd}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.crest{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.04em;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.crest.ham{background:var(--bajen);border-color:#fff;color:#fff}
.team b{font-weight:700;font-size:14px;max-width:100%}
.score{font-family:var(--display);font-weight:800;font-size:36px;line-height:1}
.score.live{color:#ffd166}
.kick{font-family:var(--display);font-weight:700;font-size:28px}
.when{font-size:12.5px;color:#cdeedd;margin-top:4px}
.livepill{display:inline-block;background:#e11d48;color:#fff;font-weight:800;font-size:11px;letter-spacing:.08em;border-radius:6px;padding:3px 8px;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--dim);font-weight:600;text-align:right;padding:6px 6px;letter-spacing:.06em}
td{padding:7px 6px;border-top:1px solid var(--line);text-align:right}
th:nth-child(2),td:nth-child(2){text-align:left}
th:first-child,td:first-child{text-align:left;color:var(--dim);width:28px}
tr.me td{background:rgba(20,163,91,.16);color:#fff;font-weight:700}
tr.me td:first-child{color:#8ff0bd;border-left:3px solid var(--hl,var(--bajen))}
tr.me[style] td{background:color-mix(in srgb,var(--hl) 18%,transparent)}
tr.me[style] td:first-child{color:#fff}
.zone-mark{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tablewrap{overflow-x:auto}
/* power bars */
.phase{display:grid;grid-template-columns:24px 1fr 64px;align-items:center;gap:10px;margin-top:8px}
.bar{height:10px;border-radius:6px;background:var(--panel-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ok);transition:width .4s}
.phase .v{text-align:right;font-weight:700}
.chart{width:100%;height:auto;display:block}
/* lights */
.lights{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lamp{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lamp.on{background:linear-gradient(180deg,rgba(246,207,85,.16),rgba(246,207,85,.06));border-color:rgba(246,207,85,.45)}
.lamp .lh{display:flex;align-items:center;gap:8px;text-align:left;width:100%;min-height:28px}
.lamp .bulb{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--panel-3);color:var(--dim)}
.lamp.on .bulb{background:var(--light);color:#3a2c00;box-shadow:0 0 14px -2px var(--light)}
.lamp .nm{flex:1;min-width:0;font-weight:600;font-size:13px}
.lamp .pc{font-size:12px;color:var(--light);font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:4px;background:linear-gradient(90deg,var(--tc,var(--light)) var(--p,50%),var(--panel-3) var(--p,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:4px;background:linear-gradient(90deg,var(--tc,var(--light)) var(--p,50%),var(--panel-3) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
input[type=range]:disabled{opacity:.35}
.zone-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.zone-h .card-t{flex:1}
/* music */
.np{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.disc{width:96px;height:96px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#c2410c)}
.disc span{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle,#f87171 0 7px,#111 8px 22px,#1d1d1d 23px)}
.disc.spin span{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc.spin span{animation:none}}
.ctrls{display:flex;gap:8px;margin-top:10px;align-items:center}
.cbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line)}
.cbtn.main{width:52px;height:52px;background:#f3f0ff;color:#14101f}
.spk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.spk:first-child{border-top:0}
.spk .vol{grid-column:1/-1;display:flex;gap:10px;align-items:center}
.spk .vol input{--tc:var(--music)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;font-weight:600;min-height:40px}
.chip.on{border-color:var(--music);color:#ddd3ff;background:rgba(167,139,250,.14)}
.radio{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.radio .btn{flex-direction:column;align-items:flex-start;min-height:84px;justify-content:space-between;background:linear-gradient(140deg,var(--g1),var(--g2));border:0;color:#fff;text-align:left}
.radio .btn b{font-family:var(--display);font-size:22px;font-weight:800}
/* car */
.car{--c:var(--copper);overflow:hidden}
.car-img{display:block;width:100%;max-width:100%;height:auto;margin:-4px 0 6px;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
.car-bar{height:6px;border-radius:4px;background:var(--panel-3);overflow:hidden;margin:4px 0 12px}
.car-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--copper),#e9b48a)}
.car-status{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);border-radius:12px;padding:10px 12px}
.car-status.idle{background:var(--panel-2);border-color:var(--line)}
/* swipe between views */
main{touch-action:pan-y}
.tablewrap,input[type=range]{touch-action:pan-x pan-y}
main.in-l{animation:inL .28s ease-out}
main.in-r{animation:inR .28s ease-out}
@keyframes inL{from{opacity:.2;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:.2;transform:translateX(-40px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main.in-l,main.in-r{animation:none}}
.swipe-dots{display:none;justify-content:center;gap:6px;margin:18px 0 4px}
.swipe-dots i{width:6px;height:6px;border-radius:50%;background:var(--panel-3);transition:width .2s,background .2s}
.swipe-dots i.on{width:18px;border-radius:4px;background:var(--fg)}
@media (hover:none){.swipe-dots{display:flex}}
/* settings form */
.inp{width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);font:inherit;min-height:44px}
.inp:focus{outline:2px solid var(--info);outline-offset:1px}
.viabadge{font-size:11px;color:var(--dim);text-align:center;margin-top:14px}
.lamp{position:relative}
.lamp.on[style*="--lc"]{background:linear-gradient(180deg,color-mix(in srgb,var(--lc) 22%,transparent),color-mix(in srgb,var(--lc) 6%,transparent));border-color:color-mix(in srgb,var(--lc) 55%,transparent)}
.lamp.on[style*="--lc"] .bulb{background:var(--lc);box-shadow:0 0 14px -2px var(--lc)}
.lamp.on[style*="--lc"] input[type=range]{--tc:var(--lc)}
.lamp.open{grid-column:1/-1}
.cdot{position:absolute;right:10px;bottom:12px;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.lamp:has(.cdot) input[type=range]:not(.huerange){width:calc(100% - 32px)}
.lamp.open .cdot{bottom:auto;top:12px;right:12px}
.lamp:has(.cdot) .pc{margin-right:28px}
.cpanel{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.sw:hover{border-color:#fff}
.sw.wide{width:auto;border-radius:999px;padding:0 14px;color:#2a2116;font-weight:700;font-size:12.5px}
input.huerange::-webkit-slider-runnable-track{height:12px;border-radius:8px;background:linear-gradient(90deg,hsl(0,100%,50%),hsl(60,100%,50%),hsl(120,100%,45%),hsl(180,100%,45%),hsl(240,100%,60%),hsl(300,100%,55%),hsl(360,100%,50%))}
input.huerange::-moz-range-track{height:12px;border-radius:8px;background:linear-gradient(90deg,hsl(0,100%,50%),hsl(60,100%,50%),hsl(120,100%,45%),hsl(180,100%,45%),hsl(240,100%,60%),hsl(300,100%,55%),hsl(360,100%,50%))}
input.huerange::-webkit-slider-thumb{margin-top:-4px}
.bajenbtn{position:relative;overflow:hidden;width:100%;background:#0d2a1c;border-color:rgba(20,163,91,.5);color:#fff;font-family:var(--display);font-weight:700;font-size:15px;justify-content:center}
.bajenbtn .stripes{position:absolute;inset:auto 0 0 0;height:5px;background:repeating-linear-gradient(90deg,var(--bajen) 0 18px,#f4f7f5 18px 36px)}
.bajenbtn.big{min-height:56px;font-size:17px}
.bajenbtn.on{background:linear-gradient(90deg,var(--bajen),#0f7a43);border-color:#fff}
.bajen .bajenbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35)}

function errText(e){

  }
  if (c === "local_auth") return "Homey godkände inte API-nyckeln. Kontrollera nyckeln och dess rättigheter.";
  if (c === "server_not_connected") return "Homey är inte ansluten. Lägg till Homey under Inställningar → Kopplingar i Claude.";

  if (c === "tool_error" && /too many/i.test(e.message||"")) return "Homey bad om en paus (för många anrop). Visar senaste data.";

    const d = S.byId[e.path.match(/\/device\/([^/]+)\//)[1]];

const S = { devices:null, byId:{}, vars:{}, varsAt:0, devAt:0, power:null, price:null, cal:null,
  err:{}, view:"hem", mcp:null, pending:{}, confirmDisarm:false, dragging:false, sel:null };

/* ---------- data ---------- */
function indexDevices(list){
  S.devices = list; S.byId = {};
  list.forEach(d => { S.byId[d.id] = d; });
  if (!S.sel){ const sp = speakers(); const playing = sp.find(d=>d.state.speaker_playing); S.sel = (playing||sp.find(d=>d.state.sonos_group)||sp[0]||{}).id; }
}
const st = (id, cap) => { const d=S.byId[id]; return d && d.state ? d.state[cap] : undefined; };
const lights = () => (S.devices||[]).filter(d => d.type==="light");
const speakers = () => (S.devices||[]).filter(d => d.type==="speaker" && d.name!=="Alla högtalare");
const zoneName = d => (d.zone||"").replace(/^Hem\s*>\s*/,"").trim() || "Övrigt";
const getVarJSON = id => { const v = S.vars[id]; if (!v || typeof v.value!=="string" || v.value.length<3) return null; try { return JSON.parse(v.value); } catch(e){ return null; } };

/* ---------- local mode: talk straight to Homey Pro on the home network ---------- */
const CFG_KEY = "hemmet.homey.v1";
function loadCfg(){ try { return JSON.parse(localStorage.getItem(CFG_KEY)||"null"); } catch(e){ return null; } }
function saveCfg(c){ try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); return true; } catch(e){ return false; } }
function normBase(h){
  h=(h||"").trim().replace(/\/+$/,""); if (!h) return "";
  if (/^https?:\/\//i.test(h)) return h;
  // On an https page Homey must be reached over https: use Homey's own local https name for the IP
  if (location.protocol === "https:" && /^\d+\.\d+\.\d+\.\d+$/.test(h)) return "https://"+h.replace(/\./g,"-")+".homey.homeylocal.com";
  return "http://"+h;
}
function makeLocalMcp(cfg){
  const local = normBase(cfg.host), remote = normBase(cfg.remote);
  let base = local, zones = null, zonesAt = 0;
  async function api(method, path, body, retried){
    let r;
    try {
      const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 8000);
      r = await fetch(base + "/api" + path, {method, headers:{"Authorization":"Bearer "+cfg.key, "Content-Type":"application/json"}, body: body===undefined?undefined:JSON.stringify(body), signal: ctl.signal});
      clearTimeout(to);
    } catch(e){
      if (!retried && remote && base === local){ base = remote; S.via = "fjärr"; return api(method, path, body, true); }
      if (!retried && base === remote && local){ base = local; }
      throw {code:"local_unreachable", message:String(e && e.message || e)};
    }
    if (base === local) S.via = "lokalt";
    if (r.status === 401 || r.status === 403) throw {code:"local_auth", message:"HTTP "+r.status};
    if (!r.ok){
      let msg = ""; try { const j = JSON.parse(await r.text()); msg = j.error_description || j.error || ""; } catch(e){}
      throw {code:"tool_error", message: msg || ("HTTP "+r.status), status:r.status, path};
    }
    if (r.status === 204) return null;
    const t = await r.text(); try { return t ? JSON.parse(t) : null; } catch(e){ return t; }
  }
  let insightsStyle = null, logList = null, logListAt = 0;
  async function getZones(){
    if (zones && Date.now()-zonesAt < 600000) return zones;
    zones = await api("GET","/manager/zones/zone/"); zonesAt = Date.now(); return zones;
  }
  function zonePath(zs, id){ const names=[]; let z=zs&&zs[id], g=0; while (z && g++<10){ names.unshift(z.name); z = z.parent ? zs[z.parent] : null; } return names.join(" > "); }
  const tools = {
    async list_devices(){
      const [devs, zs] = await Promise.all([api("GET","/manager/devices/device/"), getZones()]);
      return Object.values(devs||{}).map(d => {
        const state = {}; const co = d.capabilitiesObj || {};
        (d.capabilities||Object.keys(co)).forEach(c => { state[c] = co[c] ? co[c].value : null; });
        return {id:d.id, name:d.name, zone:zonePath(zs, d.zone), zoneId:d.zone, type:d.virtualClass||d.class, state, available:d.available!==false, unavailableMessage:d.unavailableMessage||""};
      });
    },
    async list_variables(){ const v = await api("GET","/manager/logic/variable/"); return {variables:Object.values(v||{})}; },
    async get_insights_log_entries_number(inp){
      // Look the log up in Homey's own list so the request uses exactly the ids this Homey expects
      if (!logList || Date.now() - logListAt > 3600000){
        logListAt = Date.now();
        logList = api("GET","/manager/insights/log/").then(r => Array.isArray(r) ? r : Object.values(r||{})).catch(e => { logList = null; throw e; });
      }
      const logs = await logList;
      const keysOf = l => [l.id, (l.ownerUri||l.uri)+":"+(l.ownerId||l.id), (l.uri||l.ownerUri)+":"+l.id];
      const want = [inp.logId, inp.logId.replace(/:energy_power$/, ":measure_power")];
      let log = null;
      for (const w of want){ log = logs.find(l => keysOf(l).includes(w)); if (log) break; }
      if (!log) throw {code:"tool_error", message:"Homey har ingen historik för "+inp.logId.split(":").pop()};
      const q = "/entry?resolution="+encodeURIComponent(inp.resolution);
      const owner = log.ownerUri || log.uri, oid = log.ownerId || log.id;
      const styles = [
        "/manager/insights/log/"+encodeURIComponent(owner)+"/"+encodeURIComponent(oid)+q,
        "/manager/insights/log/"+encodeURIComponent(log.id)+q,
        "/manager/insights/log/"+encodeURIComponent(log.uri||owner)+"/"+encodeURIComponent(log.id)+q
      ];
      const order = insightsStyle != null ? [insightsStyle].concat([0,1,2].filter(x=>x!==insightsStyle)) : [0,1,2];
      let lastErr;
      for (const k of order){
        try { const r = await api("GET", styles[k]); insightsStyle = k; return {entries: (r && (r.values||r.entries)) || (Array.isArray(r)?r:[])}; }
        catch(e){ lastErr = e; if (e.code !== "tool_error") throw e; }
      }
      throw lastErr;
    },
    async set_devices_capabilities_values(inp){
      const ORD = ["onoff","light_mode","light_temperature","light_hue","light_saturation","dim"];
      await Promise.all(Object.entries(inp.state||{}).map(async ([id, caps]) => {
        const keys = Object.keys(caps).filter(k=>k!=="onoff").sort((a,b)=>(ORD.indexOf(a)+99)%99-(ORD.indexOf(b)+99)%99);
        if ("onoff" in caps) caps.onoff ? keys.unshift("onoff") : keys.push("onoff"); // turn on first, turn off last
        for (const cap of keys) await api("PUT","/manager/devices/device/"+id+"/capability/"+encodeURIComponent(cap), {value:caps[cap]});
      }));
      return {ok:true};
    },
    async start_flow(inp){ return api("POST","/manager/flow/"+(inp.flowType==="advanced"?"advancedflow":"flow")+"/"+inp.flowId+"/trigger", {}); },
    async set_mood(inp){ return api("POST","/manager/moods/mood/"+inp.moodId+"/set", {}); }
  };
  const LOCAL_INTERVAL = {list_devices:10000, list_variables:30000, get_insights_log_entries_number:300000};
  const watches = [];
  function run(w){
    const fn = tools[w.tool];
    if (!fn){ w.h({type:"error", error:{code:"server_not_connected", message:"finns inte lokalt"}}); return; }
    fn(w.input).then(p => w.h({type:"data", result:{payload:p}})).catch(e => w.h({type:"error", error:e}));
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) watches.forEach(run); });
  return {
    local: true,
    watchTool(server, tool, input, handler){
      const w = {tool, input, h:handler};
      if (!tools[tool]) { setTimeout(()=>run(w),0); return ()=>{}; }
      watches.push(w); setTimeout(()=>run(w),0);
      const iv = setInterval(() => { if (!document.hidden) run(w); }, LOCAL_INTERVAL[tool] || 60000);
      return () => clearInterval(iv);
    },
    async callTool(server, tool, input){ if (!tools[tool]) throw {code:"server_not_connected"}; const p = await tools[tool](input); return {payload:p}; },
    async invalidate(server, tool){ watches.filter(w => !tool || w.tool===tool).forEach(run); }
  };
}

  return card({title:"Anslut till Homey", ic:"home", c:"var(--house)"},

    '<label class="small muted" for="cfgHost">Homeys adress på hemnätet</label><input id="cfgHost" class="inp" placeholder="t.ex. 192.168.1.50" value="'+esc(c.host||"")+'" required>'+
    '<label class="small muted" for="cfgKey" style="margin-top:10px">API-nyckel</label><input id="cfgKey" class="inp" type="password" placeholder="Klistra in nyckeln från my.homey.app" value="'+esc(c.key||"")+'" required>'+
    '<label class="small muted" for="cfgRemote" style="margin-top:10px">Fjärradress (valfritt, används när hemnätet inte nås)</label><input id="cfgRemote" class="inp" placeholder="t.ex. https://xxxxxxxx.connect.athom.com" value="'+esc(c.remote||"")+'">'+

document.addEventListener("submit", e => {
  if (e.target.id !== "cfgForm") return; e.preventDefault();
  const c = {host:$("#cfgHost").value.trim(), key:$("#cfgKey").value.trim(), remote:$("#cfgRemote").value.trim()};
  if (!c.host || !c.key) return;
  if (!saveCfg(c)) { toast("Webbläsaren tillåter inte att inställningar sparas här."); return; }
  location.reload();
});
async function boot(){
  render();
  let mcp = null;
  if (window.claude && window.claude.use){
    try { mcp = await window.claude.use("mcp"); } catch(e){ mcp = null; }
  } else {
    const cfg = loadCfg();
    S.local = true;
    if (!cfg || !cfg.host || !cfg.key){ S.showSettings = true; render(); return; }
    mcp = makeLocalMcp(cfg);
  }
  S.mcp = mcp;
  if (!mcp){ S.noMcp = true; render(); return; }
  mcp.watchTool(HOMEY, "list_devices", {}, ev => {
    if (ev.type === "data"){
      const p = parseLoose(ev.result.payload); const arr = Array.isArray(p) ? p : (p && p.devices) || null;
      if (arr){ indexDevices(arr); S.devAt = (ev.result.cache && ev.result.cache.storedAt) || Date.now(); delete S.err.dev; }
    } else { S.err.dev = ev.error; if (["needs_reauth","server_not_connected","not_in_manifest"].includes(ev.error.code)) { S.devices=null; S.byId={}; } }
    if (!S.dragging) render();
  }, {refetchInterval: 60000, cache:{staleTime:45000, gcTime:600000}});
  mcp.watchTool(HOMEY, "list_variables", {}, ev => {
    if (ev.type === "data"){
      const p = parseLoose(ev.result.payload); const arr = p && (p.variables || (Array.isArray(p)?p:null));
      if (arr){ S.vars = {}; arr.forEach(v => S.vars[v.id] = v); S.varsAt = (ev.result.cache && ev.result.cache.storedAt) || Date.now(); delete S.err.vars; }
    } else S.err.vars = ev.error;
    if (!S.dragging) render();
  }, {refetchInterval: 90000, cache:{staleTime:60000, gcTime:600000}});
  // power history: three phase power logs, summed
  mcp.watchTool(HOMEY, "get_insights_log_entries_number", {logId:"homey:device:"+DEV.pulse+":energy_power", resolution:"last6Hours"}, ev => {
    if (ev.type==="data"){ const p=parseLoose(ev.result.payload); if (p && p.entries){ S.power = p.entries.map(e=>({t:Date.parse(e.t), v:e.v})).filter(e=>e.v!=null); delete S.err.ins; render(); } }
    else { S.err.ins = ev.error; render(); }
  }, {refetchInterval: 600000, cache:{staleTime:300000, gcTime:3600000}});
  startDayWatches();
  mcp.watchTool(HOMEY, "get_insights_log_entries_number", {logId:"homey:manager:logic:"+VAR.price, resolution:"last24Hours"}, ev => {
    if (ev.type==="data"){ const p=parseLoose(ev.result.payload); if (p && p.entries){ S.price = p.entries.map(e=>({t:Date.parse(e.t), v:e.v})).filter(e=>e.v!=null); render(); } }
  }, {refetchInterval: 900000, cache:{staleTime:300000, gcTime:3600000}});
  mcp.watchTool(GCAL, "list_events", {orderBy:"startTime", pageSize:12}, ev => {
    if (ev.type==="data"){ const p=parseLoose(ev.result.payload)||{}; S.cal = p.events || p.items || []; delete S.err.cal; }
    else S.err.cal = ev.error;
    render();
  }, {refetchInterval: 900000, cache:{staleTime:600000, gcTime:3600000}});
}

/* ---------- actions ---------- */
async function act(tool, input, label, btn){
  if (!S.mcp){ toast("Öppna dashboarden i Claude för att styra hemmet."); return false; }
  if (btn) btn.classList.add("busy");
  try {
    await S.mcp.callTool(HOMEY, tool, input);
    if (label) toast(label);
    setTimeout(() => { S.mcp.invalidate(HOMEY, "list_devices").catch(()=>{}); }, 1500);
    return true;
  } catch(e){ toast(errText(e)); return false; }
  finally { if (btn) btn.classList.remove("busy"); }
}
function setCaps(map, label, btn){
  Object.keys(map).forEach(id => { const d=S.byId[id]; if (d) Object.assign(d.state, map[id]); });
  render();
  return act("set_devices_capabilities_values", {state:map}, label, btn);
}
const runFlow = (id, label, btn, type) => act("start_flow", {flowId:id, flowType:type||"standard"}, label, btn);

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a==="flow") runFlow(id, b.dataset.done || "Startade "+(b.dataset.label||"flödet"), b);
  else if (a==="mood") act("set_mood", {moodId:id}, "Ljusscen aktiverad", b);
  else if (a==="toggle"){ const cap=b.dataset.cap; setCaps({[id]:{[cap]: !st(id,cap)}}, null, null); }
  else if (a==="press"){ act("set_devices_capabilities_values", {state:{[id]:{[b.dataset.cap]:true}}}, null, b); }
  else if (a==="alloff"){ const m={}; lights().filter(d=>d.state.onoff).forEach(d=>m[d.id]={onoff:false}); if (!Object.keys(m).length){toast("Allt är redan släckt");return;} setCaps(m, "Släckte "+Object.keys(m).length+" lampor", b); }
  else if (a==="zone"){ const on = b.dataset.on==="1"; const m={}; lights().filter(d=>zoneName(d)===b.dataset.zone).forEach(d=>m[d.id]={onoff:on}); setCaps(m, on?"Tände "+b.dataset.zone:"Släckte "+b.dataset.zone, b); }
  else if (a==="temp"){ const cur = Number(st(id,"target_temperature"))||20; const nv = Math.round((cur + Number(b.dataset.d))*2)/2; setCaps({[id]:{target_temperature:nv}}, "Måltemperatur "+f1(nv)+" °C", null); }
  else if (a==="sel"){ S.sel = id; render(); }
  else if (a==="disarm-ask"){ S.confirmDisarm = true; render(); }
  else if (a==="disarm-cancel"){ S.confirmDisarm = false; render(); }
  else if (a==="disarm"){ S.confirmDisarm = false; runFlow(ALARM.disarm, "Larmet avaktiveras", b); }
  else if (a==="refresh") refreshAll(b);
  else if (a==="stab"){ S.seriesTab = b.dataset.v; render(); }
  else if (a==="mowcap"){ const cap=b.dataset.cap; let v=b.dataset.v; const cur=st(MOWER,cap); if (v==="toggle") v=!cur; else if (v==="true"||v==="false") v=(v==="true"); setCaps({[MOWER]:{[cap]:v}}, null, null); }
  else if (a==="day"){ if (S.dayRes !== b.dataset.res){ S.dayRes = b.dataset.res; S.dayHover = null; startDayWatches(); render(); } }
  else if (a==="bajen") bajenMode(b);
  else if (a==="cpick"){ S.colorOpen = S.colorOpen===id ? null : id; render(); }
  else if (a==="color") setCaps({[id]:{onoff:true, light_hue:Number(b.dataset.h), light_saturation:1, light_mode:"color"}}, null, null);
  else if (a==="white") setCaps({[id]:{onoff:true, light_temperature:Number(b.dataset.t), light_mode:"temperature"}}, null, null);
  else if (a==="cfg-open"){ S.showSettings = true; render(); window.scrollTo(0,0); }
  else if (a==="cfg-close"){ S.showSettings = false; render(); }
  else if (a==="cfg-clear"){ try{ localStorage.removeItem(CFG_KEY); }catch(e){} location.reload(); }
});
document.addEventListener("input", e => {
  const r = e.target; if (r.type!=="range") return;
  S.dragging = true; r.style.setProperty("--p", r.value+"%");
  const out = r.closest("[data-out]") && r.closest("[data-out]").querySelector(".pc"); if (out) out.textContent = r.value+"%";
});
document.addEventListener("change", e => {
  const r = e.target; if (r.type!=="range") return;
  S.dragging = false;
  const v = Number(r.value)/100, id = r.dataset.id, cap = r.dataset.cap;
  let m = {[cap]:v}; if (cap==="dim" && v>0) m.onoff = true;
  if (cap==="light_hue") m = {onoff:true, light_hue:v, light_saturation:1, light_mode:"color"};
  setCaps({[id]:m}, null, null);
});
async function refreshAll(btn){
  if (!S.mcp){ toast("Öppna dashboarden i Claude för live-data."); return; }
  if (btn) btn.classList.add("busy");
  try { await S.mcp.callTool(HOMEY, "start_flow", {flowId:FLOW_SL, flowType:"advanced"}); } catch(e){}

  setTimeout(() => { S.mcp.invalidate().catch(()=>{}); if (btn) btn.classList.remove("busy"); toast("Uppdaterat"); }, 2500);
}

});

/* ---------- sun ---------- */
function sunTimes(date){
  const rad=Math.PI/180, d=Math.floor(date.getTime()/86400000 - 0.5 + 2440588 - 2451545);
  const n=d - LON/360, M=(357.5291+0.98560028*n)%360, C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const L=(M+C+180+102.9372)%360, J=2451545+n+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*L*rad);
  const dec=Math.asin(Math.sin(L*rad)*Math.sin(23.44*rad));
  const cosw=(Math.sin(-0.833*rad)-Math.sin(LAT*rad)*Math.sin(dec))/(Math.cos(LAT*rad)*Math.cos(dec));
  if (cosw<-1||cosw>1) return null;
  const w=Math.acos(cosw)/rad/360, toMs=j=>(j+0.5-2440588)*86400000;
  return {rise:new Date(toMs(J-w)), set:new Date(toMs(J+w))};
}

/* ---------- SL ---------- */
function departures(){
  const j = getVarJSON(VAR.sl); if (!j || !Array.isArray(j.departures)) return null;
  const now = Date.now();
  return j.departures.map(d => {
    const t = Date.parse(d.expected || d.scheduled); // SL gives local Stockholm time without offset
    return {t, sched:Date.parse(d.scheduled), dest:d.destination, dir:d.direction_code, state:d.state, devs:(d.deviations||[]).map(x=>x.message).filter(Boolean), group:d.line && d.line.group_of_lines};
  }).filter(d => !isNaN(d.t) && d.t > now - 45000).sort((a,b)=>a.t-b.t);
}
function minsTo(t){ const m = Math.floor((t-Date.now())/60000); return m<=0 ? "Nu" : m; }
function busCard(compact){
  const deps = departures();
  let body;
  if (!deps){ body = '<div class="empty">Väntar på avgångar från SL via Homey. De hämtas varje minut.</div>'; }
  else if (!deps.length){ body = '<div class="empty">Inga fler avgångar med 677 från Tullen de närmaste 12 timmarna.</div>'; }
  else {
    const n = deps[0], m = minsTo(n.t), late = Math.round((n.t-n.sched)/60000);
    const bigTxt = m==="Nu" ? "Nu" : m>=60 ? tFmt.format(n.t) : m+'<span class="unit">min</span>';
    body = '<div class="bus-next"><div class="big num">'+bigTxt+'</div><div style="padding-bottom:6px"><div style="font-weight:700;font-size:16px">mot '+esc(n.dest)+'</div><div class="small" style="color:#a9c4ef">'+(m!=="Nu"&&m>=60?'om '+Math.floor(m/60)+' h '+(m%60)+' min':tFmt.format(n.t))+(late>0?' · '+late+' min sen':'')+(n.state==="CANCELLED"?' · <b style="color:var(--bad)">Inställd</b>':'')+'</div></div></div>';
    body += deps.slice(1, compact?4:8).map(d => {
      const mm = minsTo(d.t);
      return '<div class="dep'+(d.state==="CANCELLED"?" cancel":"")+'"><span class="t num">'+tFmt.format(d.t)+'</span><span class="grow ellip">mot '+esc(d.dest)+'</span><span class="m num">'+(mm==="Nu"?"Nu":mm>=60?Math.floor(mm/60)+" h "+(mm%60)+" min":mm+" min")+'</span></div>';
    }).join("");
    const devs = [...new Set(deps.flatMap(d=>d.devs))];
    if (devs.length) body += '<div class="err">'+devs.map(esc).join("<br>")+'</div>';
  }
  const right = '<span class="bus-line">677</span>';
  return card({title:"Bussen vid Tullen", ic:"bus", c:"var(--bus)", cls:"bus", right}, body + (S.varsAt?'<div class="stale" style="color:#7f9cc9">Realtid från SL · uppdateras varje minut</div>':''));
}

/* ---------- Hammarby ---------- */
function compOf(ev){ return ev && ev.competitions && ev.competitions[0]; }
function scoreVal(c){ const s=c&&c.score; if (s==null) return null; if (typeof s==="object") return s.displayValue!=null?s.displayValue:s.value; return s; }
function isHam(c){ return c && c.team && (String(c.team.id)==="2495" || /Hammarby/i.test(c.team.displayName||"")); }
function hamEvents(){

function hourly(entries, mode){ // mode: "sinceMidnight" | "cumulative" | "avg"

    entries.forEach(e => { const h = hourOf(e.t); sum[h] += e.v; n[h]++; });
    return sum.map((s,h) => n[h] ? s/n[h] : null);
  }
  const lastInHour = Array(24).fill(null);
  entries.forEach(e => { lastInHour[hourOf(e.t)] = e.v; });
  let prev = mode === "sinceMidnight" ? 0 : entries[0].v;
  for (let h = 0; h < 24; h++){
    const v = lastInHour[h]; if (v == null) continue;
    let d = v - prev; if (d < 0) d = v; // meter reset
    out[h] = Math.max(0, d); prev = v;
  }

}

function carCard(full){
  const s=(S.byId[DEV.zaptec]||{}).state;
  const img = '<img class="car-img" src="'+CAR_IMG+'" alt="Cupra Born i mörkgrått med kopparfälgar" width="760" height="346">';
  if (!s) return card({title:"Cupra Born", ic:"plug", c:"var(--copper)", cls:"car"}, img + skeleton());
  const connected = !!s["alarm_generic.car_connected"]; const kw=(s.measure_power||0)/1000; const charging = kw>0.1;
  const pill = charging?'<span class="pill ok">Laddar</span>':connected?'<span class="pill warn">Inkopplad</span>':'<span class="pill">Ej inkopplad</span>';
  const sess = s["meter_power.current_session"]; const price=curPrice();
  const pct = Math.min(100, ((sess||0)/59)*100);
  const mode = {"Connecting to car":"Ansluter till bilen","Charging":"Laddar","Charging finished":"Färdigladdad","Disconnected":"Ingen bil ansluten","Waiting":"Väntar"}[s.charge_mode] || s.charge_mode || "";
  let body = img +
    '<div class="row" style="justify-content:space-between;align-items:flex-end"><div><span class="big num">'+f1(sess)+'</span><span class="unit">kWh denna laddning</span></div><div style="text-align:right"><b class="num">'+f1(kw)+' kW</b><div class="small muted">'+(connected?"I carporten":"Inte vid laddboxen")+'</div></div></div>'+
    '<div class="car-bar" title="Laddat denna session, av ett batteri på cirka 59 kWh"><i style="width:'+pct+'%"></i></div>'+
    '<div class="car-status'+(charging||connected?"":" idle")+'"><b style="color:'+(charging?"var(--ok)":connected?"var(--warn)":"var(--muted)")+'">'+(charging?"■ Laddar i carporten":connected?"■ Inkopplad men laddar inte":"■ Ingen kabel i bilen")+'</b><div class="small muted">'+esc(mode)+(sess&&price!=null?' · ≈ '+f0(sess*price)+' kr till dagens pris':'')+'</div></div>';
  if (full) body += '<div class="tiles" style="margin-top:12px"><div class="tile"><div class="k">Laddat i år</div><div class="v num">'+f0(s.meter_power)+'<span class="unit">kWh</span></div></div><div class="tile"><div class="k">Förra laddningen</div><div class="v num">'+f1(s["meter_power.last_session"])+'<span class="unit">kWh</span></div></div><div class="tile"><div class="k">Ström L1/L2/L3</div><div class="v num" style="font-size:16px">'+f1(s["measure_current.phase1"])+' / '+f1(s["measure_current.phase2"])+' / '+f1(s["measure_current.phase3"])+' A</div></div><div class="tile"><div class="k">Laddbox</div><div class="v num" style="font-size:16px">'+f1(s.measure_temperature)+'°</div><div class="s">Zaptec Go 2</div></div></div>';
  if (connected) body += '<div class="btnrow"><button type="button" class="btn" data-act="toggle" data-id="'+DEV.zaptec+'" data-cap="charging_button" style="--c:var(--copper)"><span class="bi">'+ic(charging?"pause":"bolt",14)+'</span>'+(charging?"Pausa laddning":"Ladda nu")+'</button></div>';
  return card({title:"Cupra Born", ic:"plug", c:"var(--copper)", cls:"car", right:pill}, body);
}

function nowPlayingCard(full){
  if (!S.devices) return card({title:"Musik", ic:"music", c:"var(--music)"}, skeleton());
  const sp = speakers(); const d = S.byId[S.sel] || sp[0]; if (!d) return '';
  const s=d.state, playing=!!s.speaker_playing;
  const track = s.speaker_track && s.speaker_track!=="Idle" ? s.speaker_track : "Inget spelas";
  const sub = [s.speaker_artist, s.speaker_album].filter(Boolean).join(" · ");
  const chips = '<div class="chips" style="margin-bottom:14px">'+sp.slice().sort((a,b)=>(b.state.speaker_playing?1:0)-(a.state.speaker_playing?1:0)).slice(0, full?20:6).map(x=>'<button type="button" class="chip'+(x.id===d.id?" on":"")+'" data-act="sel" data-id="'+x.id+'">'+(x.state.speaker_playing?'♪ ':'')+esc(x.name)+'</button>').join("")+'</div>';
  const vol = Math.round((s.volume_set||0)*100);
  const body = chips+'<div class="np"><div class="disc'+(playing?" spin":"")+'"><span></span></div><div style="min-width:0"><div class="mid ellip">'+esc(track)+'</div><div class="muted ellip">'+esc(sub||zoneName(d))+'</div>'+
    '<div class="ctrls">'+(s.speaker_prev!==undefined?'<button type="button" class="cbtn" data-act="press" data-id="'+d.id+'" data-cap="speaker_prev" aria-label="Föregående">'+ic("prev",16)+'</button>':'')+
    '<button type="button" class="cbtn main" data-act="toggle" data-id="'+d.id+'" data-cap="speaker_playing" aria-label="'+(playing?"Pausa":"Spela")+'">'+ic(playing?"pause":"play",18)+'</button>'+
    (s.speaker_next!==undefined?'<button type="button" class="cbtn" data-act="press" data-id="'+d.id+'" data-cap="speaker_next" aria-label="Nästa">'+ic("next",16)+'</button>':'')+'</div></div></div>'+
    (s.volume_set!==undefined?'<div class="row" style="margin-top:14px" data-out><span class="muted">'+ic("vol",18)+'</span><input type="range" min="0" max="100" value="'+vol+'" style="--p:'+vol+'%;--tc:var(--music)" data-id="'+d.id+'" data-cap="volume_set" aria-label="Volym '+esc(d.name)+'"><b class="pc num" style="min-width:36px;text-align:right">'+vol+'%</b></div>':'')+
    (s.sonos_group?'<div class="stale">Sonos-grupp: '+esc(s.sonos_group)+'</div>':'');
  return card({title:"Musik · "+speakerName(d), ic:"music", c:"var(--music)", right: playing?'<span class="pill" style="color:var(--music)">Spelar</span>':''}, body);
}
function speakersCard(){
  if (!S.devices) return '';
  const body = speakers().map(d => { const v=Math.round((d.state.volume_set||0)*100); return '<div class="spk"><button type="button" class="ellip" style="text-align:left;font-weight:600" data-act="sel" data-id="'+d.id+'">'+esc(d.name)+' <span class="small dim">'+esc(zoneName(d))+'</span></button><span class="small '+(d.state.speaker_playing?"":"dim")+'" style="'+(d.state.speaker_playing?"color:var(--music)":"")+'">'+(d.state.speaker_playing?"Spelar":"Pausad")+'</span>'+
    (d.state.volume_set!==undefined?'<div class="vol" data-out><input type="range" min="0" max="100" value="'+v+'" style="--p:'+v+'%" data-id="'+d.id+'" data-cap="volume_set" aria-label="Volym '+esc(d.name)+'"><b class="pc num small" style="min-width:34px;text-align:right">'+v+'%</b></div>':'')+'</div>'; }).join("");
  return card({title:"Alla högtalare", ic:"vol", c:"var(--music)"}, body);
}

/* ---------- lights ---------- */
function lampTile(d){
  if (d.available === false) return '<div class="lamp" style="opacity:.55" title="'+esc(d.unavailableMessage||"Enheten svarar inte")+'"><div class="lh"><span class="bulb">'+ic("bulb",15)+'</span><span class="nm ellip">'+esc(d.name)+'</span><span class="small" style="color:var(--warn)">Ej nåbar</span></div><div class="small dim ellip">'+esc(d.unavailableMessage||"Svarar inte i Homey")+'</div></div>';
  const on=!!d.state.onoff, hasDim = typeof d.state.dim==="number", pct=Math.round((d.state.dim||0)*100);
  const rgb = isRGB(d), open = rgb && S.colorOpen===d.id, col = rgb ? lampColor(d) : "";
  return '<div class="lamp'+(on?" on":"")+(open?" open":"")+'" data-out'+(rgb&&on?' style="--lc:'+col+'"':'')+'>'+(rgb?'<button type="button" class="cdot" style="background:'+col+'" data-act="cpick" data-id="'+d.id+'" aria-expanded="'+open+'" aria-label="Byt färg på '+esc(d.name)+'"></button>':'')+'<button type="button" class="lh" data-act="toggle" data-id="'+d.id+'" data-cap="onoff" aria-pressed="'+on+'"><span class="bulb">'+ic("bulb",15)+'</span><span class="nm ellip">'+esc(d.name)+'</span>'+(hasDim&&on?'<span class="pc num">'+pct+'%</span>':'')+'</button>'+
    (hasDim?'<input type="range" min="1" max="100" value="'+pct+'" style="--p:'+pct+'%" data-id="'+d.id+'" data-cap="dim" aria-label="Ljusstyrka '+esc(d.name)+'">':'')+(open?colorPanel(d):'')+'</div>';
}
/* ---------- colour lights + Bajen mode ---------- */
const isRGB = d => d.type==="light" && typeof d.state.light_hue==="number" && d.available!==false;
const SWATCH = [
  {n:"Röd", h:0}, {n:"Orange", h:.07}, {n:"Gul", h:.14}, {n:"Bajengrön", h:.40}, {n:"Turkos", h:.5},
  {n:"Blå", h:.62}, {n:"Lila", h:.75}, {n:"Rosa", h:.9}
];
const WHITES = [{n:"Varmvitt", t:.9, css:"#ffcf8a"}, {n:"Neutralvitt", t:.5, css:"#fff1dc"}, {n:"Kallvitt", t:.05, css:"#e6f0ff"}];
function lampColor(d){
  const s=d.state;
  if (s.light_mode==="color" && typeof s.light_hue==="number") return "hsl("+Math.round(s.light_hue*360)+","+Math.round((s.light_saturation==null?1:s.light_saturation)*100)+"%,58%)";
  const t = typeof s.light_temperature==="number" ? s.light_temperature : .6;
  return "hsl(36,"+Math.round(30+t*70)+"%,"+Math.round(88-t*18)+"%)";
}
function colorPanel(d){
  const s=d.state, hue=Math.round((s.light_hue||0)*100);
  return '<div class="cpanel">'+
    '<div class="swatches">'+SWATCH.map(c=>'<button type="button" class="sw" style="background:hsl('+Math.round(c.h*360)+',100%,52%)" data-act="color" data-id="'+d.id+'" data-h="'+c.h+'" aria-label="'+c.n+'" title="'+c.n+'"></button>').join("")+'</div>'+
    (typeof s.light_temperature==="number"||s.light_temperature===null?'<div class="swatches">'+WHITES.map(w=>'<button type="button" class="sw wide" style="background:'+w.css+'" data-act="white" data-id="'+d.id+'" data-t="'+w.t+'">'+w.n+'</button>').join("")+'</div>':'')+
    '<label class="small muted" for="hue-'+d.id+'">Egen färg</label><input id="hue-'+d.id+'" class="huerange" type="range" min="0" max="100" value="'+hue+'" data-id="'+d.id+'" data-cap="light_hue" aria-label="Färgton '+esc(d.name)+'">'+
    '</div>';
}
const BAJEN_HUE = .40;
const BAJ_KEY = "hemmet.bajen.prev";
function bajenIsOn(){ try { return !!localStorage.getItem(BAJ_KEY); } catch(e){ return !!S.bajenPrev; } }
function bajenMode(btn){
  const rgb = lights().filter(isRGB);
  if (!rgb.length){ toast("Hittar inga färglampor att göra grönvita"); return; }
  if (bajenIsOn()){
    let prev = S.bajenPrev; try { prev = JSON.parse(localStorage.getItem(BAJ_KEY)) || prev; } catch(e){}
    try { localStorage.removeItem(BAJ_KEY); } catch(e){} S.bajenPrev = null;
    if (prev) { const m={}; Object.entries(prev).forEach(([id,st])=>{ if (S.byId[id]) { m[id]={}; const keys = st.light_mode==="temperature" ? ["light_temperature","light_mode"] : st.light_mode==="color" ? ["light_hue","light_saturation","light_mode"] : ["light_hue","light_saturation"]; keys.concat(["dim","onoff"]).forEach(k=>{ if (st[k]!=null) m[id][k]=st[k]; }); } }); setCaps(m, "Bajen-läge av – lamporna är som innan", btn); }
    return;
  }
  const prev = {}; rgb.forEach(d => prev[d.id] = {onoff:d.state.onoff, dim:d.state.dim, light_hue:d.state.light_hue, light_saturation:d.state.light_saturation, light_temperature:d.state.light_temperature, light_mode:d.state.light_mode});
  S.bajenPrev = prev; try { localStorage.setItem(BAJ_KEY, JSON.stringify(prev)); } catch(e){}
  const m = {};
  rgb.forEach((d,i) => {
    m[d.id] = i%2===0 ? {onoff:true, light_hue:BAJEN_HUE, light_saturation:1, light_mode:"color", dim:1}
      : (typeof d.state.light_temperature==="number" ? {onoff:true, light_temperature:.35, light_mode:"temperature", dim:1} : {onoff:true, light_hue:BAJEN_HUE, light_saturation:0, light_mode:"color", dim:1});
  });
  setCaps(m, "Bajen-läge på – "+rgb.length+" lampor i grönt och vitt", btn);
}
function bajenButton(big){
  const on = bajenIsOn();
  return '<button type="button" class="btn bajenbtn'+(on?" on":"")+(big?" big":"")+'" data-act="bajen" aria-pressed="'+on+'"><span class="stripes" aria-hidden="true"></span>'+(on?"Bajen-läge på · Stäng av":"Slå på Bajen-läge")+'</button>';
}
function colorCard(){
  const rgb = lights().filter(isRGB);
  if (!rgb.length) return '';
  return card({title:"Färglampor", ic:"bulb", c:"var(--bajen)", right: bajenIsOn()?'<span class="pill ok">Bajen-läge</span>':''},
    '<div class="small muted" style="margin-bottom:10px">Tryck på färgpricken på en lampa för att byta färg. Bajen-läget gör lamporna växelvis gröna och vita, och återställer dem när du stänger av.</div>'+bajenButton(true));
}

function lightZones(){
  const z = {}; lights().forEach(d => (z[zoneName(d)] = z[zoneName(d)]||[]).push(d));
  return Object.entries(z).sort((a,b)=>b[1].length-a[1].length);
}
function lightsSummaryCard(){
  if (!S.devices) return card({title:"Ljus", ic:"bulb", c:"var(--light)"}, skeleton());
  const L = lights(), on = L.filter(d=>d.state.onoff);
  const sun = sunTimes(new Date());
  return card({title:"Just nu", ic:"bulb", c:"var(--light)"}, '<div class="row"><span class="badge-ic" style="--c:var(--light);width:52px;height:52px;border-radius:14px;background:var(--light);color:#3a2c00">'+ic("bulb",26)+'</span><div><div><span class="big num">'+on.length+'</span><span class="unit">av '+L.length+' tända</span></div><div class="small muted">'+lightZones().filter(([,l])=>l.some(d=>d.state.onoff)).length+' av '+lightZones().length+' rum med ljus</div></div></div>'+
    (sun?'<div class="tiles" style="margin-top:12px"><div class="tile"><div class="k">Solnedgång</div><div class="v num">'+tFmt.format(sun.set)+'</div><div class="s">Ytterbelysningen tänds</div></div><div class="tile"><div class="k">Soluppgång</div><div class="v num">'+tFmt.format(sun.rise)+'</div><div class="s">släcks en timme efter</div></div></div>':''));
}
function zoneCard(name, list){
  const on = list.filter(d=>d.state.onoff).length;
  const right = '<button type="button" class="pill '+(on?"warn":"")+'" data-act="zone" data-zone="'+esc(name)+'" data-on="'+(on?0:1)+'">'+on+'/'+list.length+' · '+(on?"Släck":"Tänd")+'</button>';
  return card({title: name==="Hem"?"Övriga (Osram)":name, ic:"bulb", c:"var(--light)", right}, '<div class="lights">'+list.map(lampTile).join("")+'</div>');
}

/* ---------- house ---------- */
function ajaxEvent(e){
  if (!e || e==="-") return "–";
  return e.replace(/^Armed with malfunctions$/i,"Larmat trots fel").replace(/^Armed$/i,"Larmat").replace(/^Disarmed$/i,"Avlarmat").replace(/^Night mode (on|activated)$/i,"Nattläge på").replace(/^Group disarmed \(Zone (\d+)\)$/i,"Grupp avlarmad (zon $1)").replace(/^Group armed \(Zone (\d+)\)$/i,"Grupp larmad (zon $1)");
}

function alarmCard(){
  const s=(S.byId[DEV.ajax]||{}).state; if (!s) return card({title:"Larm", ic:"shield", c:"var(--bad)"}, skeleton());
  // The hub-level state does not follow group arming over SIA, so the latest event wins when it says something clear
  const ev = (s.ajax_last_event||"").toLowerCase();
  let state = s.homealarm_state, night = s.ajax_night_mode;
  if (/disarm/.test(ev)) { state = "disarmed"; night = false; }
  else if (/night/.test(ev)) { state = "partially_armed"; night = true; }
  else if (/\barm/.test(ev)) { state = "armed"; }
  const lbl = state==="armed"?"Larmat":state==="partially_armed"||night?"Nattläge":"Avlarmat";
  const cls = state==="disarmed"?"ok":"bad";
  const alarms = ["alarm_generic","alarm_fire","alarm_water","alarm_co","alarm_tamper"].filter(k=>s[k]);
  const body = '<div class="row"><span class="mid">'+lbl+'</span></div><div class="small muted" style="margin-top:4px">Senaste händelse: '+esc(ajaxEvent(s.ajax_last_event))+'</div>'+
    (s.ajax_connection_state===false?'<div class="err">Homey har tappat kontakten med Ajax-hubben. Statusen kan vara gammal.</div>':'')+
    (/malfunction/i.test(s.ajax_last_event||"")?'<div class="err">Larmet slogs på trots fel på någon enhet. Kolla Ajax-appen.</div>':'')+
    (alarms.length?'<div class="err" style="color:var(--bad);border-color:rgba(248,113,113,.4)">Aktivt larm: '+alarms.map(a=>({alarm_generic:"inbrott",alarm_fire:"brand",alarm_water:"vatten",alarm_co:"kolmonoxid",alarm_tamper:"sabotage"}[a])).join(", ")+'</div>':'')+
    '<div class="stale">Larmet styrs i Ajax-appen. Statusen visar senaste händelsen från hubben.</div>';
  return card({title:"Larm · Ajax", ic:"shield", c:"var(--bad)", right:'<span class="pill '+cls+'">'+lbl+'</span>'}, body);
}

function calCard(){

  else {
    const days = {};
    S.cal.forEach(e=>{ const s=e.start||{}; const allDay=!!s.date&&!s.dateTime; const t=Date.parse(s.dateTime||s.date+"T00:00:00"); const key=new Date(t).toDateString(); (days[key]=days[key]||{t,items:[]}).items.push({t,allDay,title:e.summary||"(utan titel)",loc:e.location,end:Date.parse((e.end||{}).dateTime||"")}); });

  return card({title:"Kalender", ic:"cal", c:"var(--info)"}, body);

function banner(){
  if (S.showSettings) return settingsCard();
  if (S.local && (S.err.dev||S.err.vars) && (S.err.dev||S.err.vars).code && /local_/.test((S.err.dev||S.err.vars).code)) return '<div class="banner" style="border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)">'+ic("shield",20)+'<span class="grow">'+esc(errText(S.err.dev||S.err.vars))+(S.devices?' Visar senast hämtade läge.':'')+'</span><button type="button" class="btn" data-act="cfg-open">Inställningar</button></div>';
  if (S.noMcp) return '<div class="banner">'+ic("home",20)+'<span>Den här dashboarden läser och styr ditt hem via Homey-kopplingen i Claude. Öppna den i Claude (webb, app eller på en väggplatta) så fylls allt i.</span></div>';
  const e = S.err.dev || S.err.vars;
  if (e && !S.devices) return '<div class="banner" style="border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)">'+ic("shield",20)+'<span>'+esc(errText(e))+'</span></div>';
  return '';
}
const VIEW = {
  hem: () => '<div class="grid">'+'<div class="span-4">'+headerCard()+'</div>'+
    '<div class="col span-2">'+nowPlayingCard(false)+quickCard()+tempsCard()+'</div>'+
    '<div class="col">'+busCard(true)+carCard(false)+powerNowCard()+calCard()+'</div>'+
    '<div class="col">'+bajenCard()+alarmCard()+checksCard()+'</div></div>'+(S.local?'<div class="viabadge">Ansluten till Homey '+esc(S.via||"")+' · <button type="button" data-act="cfg-open" style="color:var(--muted);text-decoration:underline">Inställningar</button></div>':''),
  musik: () => '<h1 class="view-title">Multimedia</h1><div class="grid"><div class="col span-2">'+nowPlayingCard(true)+radioCard()+'</div><div class="col">'+speakersCard()+'</div><div class="col">'+sonosCard()+'</div></div>',
  el: () => '<h1 class="view-title">El</h1><div class="grid"><div class="col">'+powerNowCard()+pulseCard()+'</div><div class="col span-2">'+priceCard()+dayEnergyCard()+powerHistCard()+'</div><div class="col">'+carCard(true)+solarCard()+'</div></div>',
  ljus: () => '<h1 class="view-title">Ljus</h1><div class="grid"><div class="col span-2">'+quickCard()+'</div><div class="col span-2">'+lightsSummaryCard()+colorCard()+'</div>'+
    (S.devices? lightZones().map(([n,l])=>'<div class="span-2">'+zoneCard(n,l)+'</div>').join("") : '')+'</div>',
  huset: () => '<h1 class="view-title">Huset</h1><div class="grid"><div class="col">'+mowerCard()+alarmCard()+vacCard()+'</div><div class="col span-2">'+tempsCard()+climateCard()+coldCard()+'</div><div class="col">'+checksCard()+poolCard()+batteryCard()+calCard()+'</div></div>',
  sport: () => '<h1 class="view-title">Sport</h1><div class="grid"><div class="col span-2">'+bajenCard()+(S.devices&&!bajenIsOn()?'<div>'+bajenButton(true)+'</div>':'')+fixturesCard()+tableCard()+roundCard()+'</div><div class="col span-2">'+LOCAL.map(t => localCard(t)).join("")+'</div></div>'
};
Object.keys(DEEP).forEach(k => { VIEW[k] = () => deepPage(k); });
function renderNav(){
  const cb = $("#cfgBtn"); if (cb) cb.hidden = !S.local;
  $("#nav").innerHTML = VIEWS.map(v => '<a href="#'+v.id+'" style="--c:'+v.c+'"'+((S.view===v.id || (v.id==="sport" && S.view.startsWith("sport-")))?' aria-current="page"':'')+'><span class="ic">'+ic(v.ic,20)+'</span>'+esc(v.label)+'</a>').join("");
  $("#logo").classList.toggle("off", !!(S.noMcp || (S.err.dev && !S.devices)));
}
function render(){
  renderNav();
  const main = $("#main"); const y = window.scrollY;
  main.innerHTML = banner() + VIEW[S.view]() + '<div class="swipe-dots" aria-hidden="true">'+ORDER.map(id=>'<i class="'+(id===S.view?"on":"")+'"></i>').join("")+'</div>';
  window.scrollTo(0, y);
}
const ORDER = VIEWS.map(v => v.id);
function route(){
  const h=(location.hash||"").slice(1); const prev = S.view; S.view = VIEW[h] ? h : "hem";
  render();
  if (prev !== S.view){
    window.scrollTo(0,0);
    const m = $("#main"); m.classList.remove("in-l","in-r"); void m.offsetWidth;
    m.classList.add(ORDER.indexOf(S.view) > ORDER.indexOf(prev) ? "in-l" : "in-r");
  }
}
window.addEventListener("hashchange", route);
$("#main").addEventListener("animationend", e => e.currentTarget.classList.remove("in-l","in-r"));
/* swipe left/right on the content to move between views; buttons still work */
(function(){
  let sx=0, sy=0, st=0, ok=false;
  const main = $("#main");
  main.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) { ok=false; return; }
    const t = e.target;
    ok = !(t.closest && t.closest('input[type=range], .tablewrap, .chips, .confirm'));
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
  }, {passive:true});
  main.addEventListener("touchend", e => {
    if (!ok || S.dragging) return; ok = false;
    const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6 || Date.now() - st > 800) return;
    if (S.view.startsWith("sport-")){ if (dx > 0) location.hash = "#sport"; return; }
    const i = ORDER.indexOf(S.view), next = dx < 0 ? i + 1 : i - 1;
    if (next < 0 || next >= ORDER.length) return;
    location.hash = "#" + ORDER[next];
  }, {passive:true});
})();
// tick: clock + countdowns
setInterval(() => { const c=$("#clock"); if (c) c.textContent = tFmt.format(new Date()); }, 1000);
setInterval(() => { if (!S.dragging && (S.view==="hem"||S.view==="sport")) render(); }, 20000);
route();
boot();
if (!(window.claude && window.claude.use) && location.protocol === "https:" && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
})();
</script>

</body>
</html>
